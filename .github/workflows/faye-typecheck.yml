name: Faye typecheck

on:
  pull_request:
    paths:
      - 'artifacts/faye-bot/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/faye-typecheck.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/faye-bot/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/faye-typecheck.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/faye-bot run typecheck
      - run: pnpm --filter @workspace/faye-bot test
